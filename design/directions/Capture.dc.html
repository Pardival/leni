<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #ffd6c9; } a:hover { color: #ffffff; }
    @keyframes bar { 0%,100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
    .bar { transform-origin: center; animation: bar 1.1s ease-in-out infinite; }
    .b2 { animation-delay: 0.1s; } .b3 { animation-delay: 0.2s; } .b4 { animation-delay: 0.3s; } .b5 { animation-delay: 0.4s; } .b6 { animation-delay: 0.5s; } .b7 { animation-delay: 0.6s; }
    @keyframes ring { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.9); opacity: 0; } }
    .ring { animation: ring 1.8s ease-out infinite; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: linear-gradient(180deg, #ff7a55 0%, #f4532d 60%, #d93d1a 100%); color: #ffffff; display: flex; flex-direction: column;">

  <!-- Haut -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 60px 24px 0 24px;">
    <div style="width: 40px; height: 40px; border-radius: 999px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.18); font-size: 13px; font-weight: 600;"><span style="width: 8px; height: 8px; border-radius: 999px; background: #ffffff; display: inline-block;"></span>0:07</div>
  </div>

  <!-- Transcription en direct -->
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 56px 28px 0 28px; flex-grow: 1;">
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.8;">Je t'écoute</div>
    <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 30px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em;">Je voudrais rajouter un personnage féminin négatif dans mon roman, une rivale de la narratrice qui apparaît<span style="opacity: 0.55;"> au chapitre trois…</span></div>
  </div>

  <!-- Onde + bouton -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 0 24px 36px 24px;">
    <div style="display: flex; align-items: center; gap: 6px; height: 48px;">
      <span class="bar" style="width: 6px; height: 48px; border-radius: 3px; background: rgba(255,255,255,0.9); display: inline-block;"></span>
      <span class="bar b2" style="width: 6px; height: 48px; border-radius: 3px; background: rgba(255,255,255,0.9); display: inline-block;"></span>
      <span class="bar b3" style="width: 6px; height: 48px; border-radius: 3px; background: rgba(255,255,255,0.9); display: inline-block;"></span>
      <span class="bar b4" style="width: 6px; height: 48px; border-radius: 3px; background: rgba(255,255,255,0.9); display: inline-block;"></span>
      <span class="bar b5" style="width: 6px; height: 48px; border-radius: 3px; background: rgba(255,255,255,0.9); display: inline-block;"></span>
      <span class="bar b6" style="width: 6px; height: 48px; border-radius: 3px; background: rgba(255,255,255,0.9); display: inline-block;"></span>
      <span class="bar b7" style="width: 6px; height: 48px; border-radius: 3px; background: rgba(255,255,255,0.9); display: inline-block;"></span>
    </div>
    <div style="position: relative; width: 88px; height: 88px; display: flex; align-items: center; justify-content: center;">
      <div class="ring" style="position: absolute; inset: 0; border-radius: 999px; border: 2px solid rgba(255,255,255,0.7);"></div>
      <div style="width: 88px; height: 88px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 30px -10px rgba(0,0,0,0.35);">
        <span style="width: 28px; height: 28px; border-radius: 8px; background: #f4532d; display: inline-block;"></span>
      </div>
    </div>
    <div style="font-size: 14px; font-weight: 600; opacity: 0.9;">Touche pour terminer</div>
  </div>
</div>
</x-dc>
</body>
</html>
