<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Nunito', system-ui, sans-serif; }
    a { color: #1d4ed8; } a:hover { color: #1e40af; }
    @keyframes pop { 0% { transform: scale(0.92); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); } }
    .pop { animation: pop 0.5s cubic-bezier(.2,.9,.3,1.3) both; }
    .pop-2 { animation-delay: 0.08s; } .pop-3 { animation-delay: 0.16s; } .pop-4 { animation-delay: 0.24s; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #fbf7ef; color: #14110d; display: flex; flex-direction: column;">

  <!-- En-tête -->
  <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 66px 22px 0 22px;">
    <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1;">Tes notes</div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: #14110d; color: #fbf7ef; font-size: 13px; font-weight: 700;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg>
      7 jours
    </div>
  </div>

  <!-- Bento des thèmes -->
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 22px 22px 0 22px;">
    <div class="pop" style="display: flex; flex-direction: column; justify-content: space-between; height: 118px; padding: 16px; border-radius: 22px; background: #2fbf71; color: #062b17; border: 2px solid #14110d; box-shadow: 4px 4px 0 #14110d;">
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 34px; font-weight: 800; line-height: 1;">4</div>
      <div style="font-size: 15px; font-weight: 700;">Santé</div>
    </div>
    <div class="pop pop-2" style="display: flex; flex-direction: column; justify-content: space-between; height: 118px; padding: 16px; border-radius: 22px; background: #8b5cf6; color: #fbf7ef; border: 2px solid #14110d; box-shadow: 4px 4px 0 #14110d;">
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 34px; font-weight: 800; line-height: 1;">1</div>
      <div style="font-size: 15px; font-weight: 700;">Projets</div>
    </div>
    <div class="pop pop-3" style="display: flex; flex-direction: column; justify-content: space-between; height: 118px; padding: 16px; border-radius: 22px; background: #ff6b9d; color: #3a0a1d; border: 2px solid #14110d; box-shadow: 4px 4px 0 #14110d;">
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 34px; font-weight: 800; line-height: 1;">1</div>
      <div style="font-size: 15px; font-weight: 700;">Relations</div>
    </div>
    <div class="pop pop-4" style="display: flex; flex-direction: column; justify-content: space-between; height: 118px; padding: 16px; border-radius: 22px; background: #ffd166; color: #3d2a00; border: 2px solid #14110d; box-shadow: 4px 4px 0 #14110d;">
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 34px; font-weight: 800; line-height: 1;">2</div>
      <div style="font-size: 15px; font-weight: 700;">Potager</div>
    </div>
  </div>

  <!-- Dernières notes -->
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 22px 22px 0 22px; flex-grow: 1;">
    <div style="font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #7a6f5e;">Aujourd'hui</div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: #ffffff; border: 2px solid #14110d;">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #8b5cf6; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5V16h8v-2.5A6 6 0 0 0 12 3z"/></svg></div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
        <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 16px; font-weight: 700; line-height: 1.2;">Une rivale pour la narratrice</div>
        <div style="font-size: 13px; color: #7a6f5e;">Projets · 15:02</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: #ffffff; border: 2px solid #14110d;">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #2fbf71; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4L19 6"/></svg></div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
        <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 16px; font-weight: 700; line-height: 1.2;">Douleurs au dos, soins à prévoir</div>
        <div style="font-size: 13px; color: #7a6f5e;">Santé · 2 actions</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: #ffffff; border: 2px solid #14110d;">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #ff6b9d; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg></div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
        <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 16px; font-weight: 700; line-height: 1.2;">Réconciliation avec Clara</div>
        <div style="font-size: 13px; color: #7a6f5e;">Relations · hier</div>
      </div>
    </div>
  </div>

  <!-- Gros bouton de capture -->
  <div style="display: flex; justify-content: center; padding: 0 22px 14px 22px;">
    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 60px; border-radius: 999px; background: #ff5c2e; color: #fbf7ef; border: 2px solid #14110d; box-shadow: 4px 4px 0 #14110d; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 18px; font-weight: 800;">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      Dicter une note
    </div>
  </div>

  <!-- Barre d'onglets -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 10px 22px 26px 22px; border-top: 2px solid #14110d; background: #fbf7ef;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #14110d; font-size: 11px; font-weight: 800;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>Notes</div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #a39a8b; font-size: 11px; font-weight: 700;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.2 7.2l7.4 0.6M7.5 8l3.2 8M16.6 10.2l-3.4 5.8"/></svg>Explorer</div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #a39a8b; font-size: 11px; font-weight: 700;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Réglages</div>
  </div>
</div>
</x-dc>
</body>
</html>
